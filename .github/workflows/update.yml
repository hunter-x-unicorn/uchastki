name: Publish compatible app update (Expo Free)

on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed in this update?
        required: true
        default: Update app screens and logic

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Check free Expo project configuration
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Set EXPO_TOKEN in repository secrets first.'; exit 1; }
      - run: npx --yes eas-cli@27.10.0 update --channel production --environment production --message "$UPDATE_MESSAGE" --non-interactive
