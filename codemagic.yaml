workflows:
  ios-unsigned:
    name: Unsigned iPhone IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      xcode: latest
      cocoapods: default
      # Optional variables configured in Codemagic UI:
      # EXPO_PUBLIC_EAS_PROJECT_ID, EXPO_OWNER
    scripts:
      - name: Install and check
        script: |
          npm ci
          npm run typecheck
          npm test
      - name: Prepare iOS project
        script: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Build unsigned IPA
        script: bash scripts/build-ios-unsigned.sh
    artifacts:
      - artifacts/uchastki-unsigned.ipa
